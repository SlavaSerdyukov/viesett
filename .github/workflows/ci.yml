name: Viesett product gates
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: viesett
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: viesett_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U viesett -d viesett_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      VIESETT_ENVIRONMENT: test
      VIESETT_DATABASE_URL: postgresql+asyncpg://viesett:ci-only@localhost:5432/viesett_test
      VIESETT_TEST_DATABASE_URL: postgresql+asyncpg://viesett:ci-only@localhost:5432/viesett_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.7"
          python-version: "3.12"
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run alembic upgrade 5e1e917449ce
      - run: uv run python scripts/verify_milestone_upgrade.py seed
      - run: uv run alembic upgrade da321bc669fb
      - run: uv run python scripts/verify_milestone_upgrade.py verify
      - run: uv run python scripts/verify_m3_upgrade.py seed
      - run: uv run alembic upgrade 192e0442ffc8
      - run: uv run python scripts/verify_m3_upgrade.py verify
      - run: uv run python scripts/verify_m3_upgrade.py guard
      - run: uv run python scripts/verify_m4_upgrade.py seed
      - run: uv run alembic upgrade d64802d3610f
      - run: uv run python scripts/verify_m4_upgrade.py verify
      - run: uv run python scripts/verify_m4_upgrade.py guard
      - run: uv run alembic downgrade 192e0442ffc8
      - run: uv run python scripts/verify_m4_upgrade.py verify-m3
      - run: uv run alembic upgrade d64802d3610f
      - run: uv run python scripts/verify_m4_upgrade.py verify
      - run: uv run python scripts/verify_m4_upgrade.py cleanup
      - run: uv run python scripts/verify_m5_upgrade.py seed
      - run: uv run alembic upgrade head
      - run: uv run python scripts/verify_m5_upgrade.py verify
      - run: uv run python scripts/verify_m5_upgrade.py guard
      - run: uv run alembic check
      - run: uv run alembic downgrade d64802d3610f
      - run: uv run python scripts/verify_m5_upgrade.py verify
      - run: uv run alembic upgrade head
      - run: uv run python scripts/verify_m5_upgrade.py verify
      - run: uv run python scripts/verify_m5_upgrade.py cleanup
      - run: uv run alembic downgrade da321bc669fb
      - run: uv run alembic upgrade head
      - run: uv run alembic downgrade base
      - run: uv run alembic upgrade head
      - run: uv run alembic check
      - run: uv run pytest
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --prefix web
      - run: uv run python scripts/generate_web_contract.py --check
      - run: npm --prefix web run lint
      - run: npm --prefix web run typecheck
      - run: npm --prefix web run format:check
      - run: npm --prefix web test
      - run: npm --prefix web run build
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - run: npm --prefix web run e2e
