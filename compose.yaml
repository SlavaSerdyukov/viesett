services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: viesett
      POSTGRES_USER: viesett
      POSTGRES_PASSWORD: development-only
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U viesett -d viesett"]
      interval: 3s
      timeout: 3s
      retries: 15
  api:
    build: .
    profiles: ["api"]
    environment:
      VIESETT_DATABASE_URL: postgresql+asyncpg://viesett:development-only@db:5432/viesett
      VIESETT_ALLOW_DEVELOPMENT_SAFETY: "true"
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - private-objects:/app/.local/objects
volumes:
  postgres-data:
  private-objects:
